# prettier-ignore
procs:
  server:
    shell: >-
      cargo run --bin sshxx-server --
      --override-origin http://localhost:5173
      --secret dev-secret
      --session-name dev
      --redis-url redis://localhost:12601
  daemon:
    shell: >-
      cargo run --bin sshxx-daemon --
      --server http://[::1]:8051
      --test-encryption-key localdevkey
  web:
    shell: npm run dev
    stop: SIGKILL  # TODO: Why is this necessary?
