[workspace]
members = ["crates/*", "src-tauri"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = ["sshxx contributors"]
license = "MIT"
description = "A self-hosted, persistent, collaborative terminal."
repository = "https://github.com/glight2000/sshxx"
keywords = ["ssh", "terminal", "collaborative", "self-hosted"]

[workspace.dependencies]
anyhow = "1.0.104"
aes-gcm = "0.10.3"
clap = { version = "4.6.6", features = ["derive", "env"] }
prost = "0.14.4"
portable-pty = "0.9.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
sshx-core = { package = "sshxx-core", version = "0.6.0", path = "crates/sshx-core" }
sshxx-terminal-host = { version = "0.6.0", path = "crates/sshxx-terminal-host", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
