<!doctype html>
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
    />

    <script>
      try {
        const saved = JSON.parse(
          localStorage.getItem("sshx-settings-store") || "{}",
        );
        const preference = ["light", "dark"].includes(saved.colorMode)
          ? saved.colorMode
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.colorMode = preference;
      } catch {
        document.documentElement.dataset.colorMode = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>

    <title>sshxx</title>
    <meta
      property="og:title"
      content="sshxx · persistent collaborative terminals"
    />
    <meta
      name="description"
      content="Fast, collaborative live terminals in the browser, with real-time chat, cursors, and activity tracking."
    />
    <meta
      property="og:description"
      content="Fast, collaborative live terminals in the browser, with real-time chat, cursors, and activity tracking."
    />
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
