name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rustfmt:
    name: Rust format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install nightly --profile minimal -c rustfmt

      - run: cargo +nightly fmt -- --check

  rust:
    name: Rust lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3

      - run: rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

  windows_test:
    name: Daemon and terminal host test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3

      - run: rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test -p sshxx-daemon -p sshxx-terminal-host

  web:
    name: Web lint, check, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run test:runtime

      - run: npm run build

  app:
    name: App check (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: rustup toolchain install stable

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run build

      - run: cargo check -p sshxx-client
