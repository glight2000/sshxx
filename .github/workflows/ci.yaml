name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.0"

jobs:
  rustfmt:
    name: Rust format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt
          rustup default "$RUST_VERSION"

      - run: cargo fmt --all -- --check

  rust:
    name: Rust lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

  windows_test:
    name: Runtime tests (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$env:RUST_VERSION"
          rustup default "$env:RUST_VERSION"

      - uses: Swatinem/rust-cache@v2

      - run: cargo test -p sshxx-daemon -p sshxx-server -p sshxx-terminal-host

  web:
    name: Web lint, check, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run test:runtime

      - run: npm run build

  app:
    name: App check (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION"
          rustup default "$RUST_VERSION"

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run build

      - run: cargo check -p sshxx-client
