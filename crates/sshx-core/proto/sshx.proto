// This file contains the service definition for sshxx, used by the daemon to
// communicate their terminal state over gRPC.

syntax = "proto3";
package sshx;

service SshxService {
  // Create a new SSH session for a given computer.
  rpc Open(OpenRequest) returns (OpenResponse);

  // Stream real-time commands and terminal outputs to the session.
  rpc Channel(stream ClientUpdate) returns (stream ServerUpdate);

  // Gracefully shut down an existing SSH session.
  rpc Close(CloseRequest) returns (CloseResponse);
}

// Details of bytes exchanged with the terminal.
message TerminalData {
  uint32 id = 1;  // ID of the shell.
  bytes data = 2; // Encrypted, UTF-8 terminal data.
  uint64 seq = 3; // Sequence number of the first byte.
}

// Details of bytes input to the terminal (not necessarily valid UTF-8).
message TerminalInput {
  uint32 id = 1;     // ID of the shell.
  bytes data = 2;    // Encrypted binary sequence of terminal data.
  uint64 offset = 3; // Offset of the first byte for encryption.
}

// Encrypted image bytes uploaded from a browser to the daemon cache.
message ImageUploadChunk {
  uint32 id = 1;         // ID of the local shell receiving the resulting path.
  string upload_id = 2;  // Random lowercase hexadecimal identifier.
  string media_type = 3; // Supported browser image MIME type.
  uint64 total_size = 4; // Complete plaintext image size.
  uint64 stream_num = 5; // Unique AES-CTR stream number for this upload.
  uint64 offset = 6;     // Plaintext byte offset of this chunk.
  bytes data = 7;        // Encrypted image bytes.
  bool complete = 8;     // This chunk completes the image.
}

// Pair of a terminal ID and its associated size.
message TerminalSize {
  uint32 id = 1;   // ID of the shell.
  uint32 rows = 2; // Number of rows for the terminal.
  uint32 cols = 3; // Number of columns for the terminal.
}

// Request to open an sshxx session.
message OpenRequest {
  string origin = 1;                      // Web origin of the server.
  bytes encrypted_zeros = 2;              // Encrypted zero block, for client verification.
  string name = 3;                        // Name of the session (user@hostname).
  optional bytes write_password_hash = 4; // Hashed write password, if read-only mode is enabled.
  string daemon_version = 5;              // Version of the daemon hosting terminal processes.
  optional WorkspaceState workspace = 6;  // Locally persisted workspace to restore.
  optional SshProfileCollection ssh_profiles = 7; // Locally persisted SSH connection profiles.
  repeated string capabilities = 8;        // Optional daemon protocol capabilities.
}

// Details of a newly-created sshxx session.
message OpenResponse {
  string name = 1;  // Name of the session.
  string token = 2; // Signed verification token for the client.
  string url = 3;   // Public web URL to view the session.
}

// Sequence numbers for all active shells, used for synchronization.
message SequenceNumbers {
  map<uint32, uint64> map = 1; // Active shells and their sequence numbers.
}

// Data for a new shell.
message NewShell {
  uint32 id = 1; // ID of the shell.
  int32 x = 2;   // X position of the shell.
  int32 y = 3;   // Y position of the shell.
  optional uint32 source_id = 4; // Shell whose working directory should be copied.
  uint32 page_id = 5; // Canvas page containing the shell.
  uint32 rows = 6; // Initial terminal rows, or zero for the default.
  uint32 cols = 7; // Initial terminal columns, or zero for the default.
  optional SshProfile ssh_profile = 8; // Optional SSH connection to launch instead of the local shell.
  string theme = 9; // Per-terminal color theme, or empty for a legacy default.
  uint32 width = 10; // Exact canvas window width, or zero for legacy auto sizing.
  uint32 height = 11; // Exact canvas window height, or zero for legacy auto sizing.
  string background = 12; // Per-terminal background override, or empty to use the theme.
  string working_directory = 13; // Explicit local or remote working directory for the new shell.
  string ssh_profile_id = 14; // Durable SSH connection identity, empty for local shells.
  bool copy_history = 15; // Copy the source terminal's daemon-managed command history.
}

// End-to-end encrypted filesystem operation sent to sshxx-daemon.
message FileRequest {
  uint32 id = 1; // Shell whose local or SSH filesystem should be used.
  string request_id = 2; // Random request identifier used by the browser.
  uint64 request_stream = 3; // Unique AES-CTR stream for the request body.
  uint64 response_stream = 4; // Unique AES-CTR stream reserved for the response.
  bytes data = 5; // Encrypted JSON request body.
}

// End-to-end encrypted filesystem result returned to the requesting browser.
message FileResponse {
  string request_id = 1;
  uint64 stream_num = 2;
  bytes data = 3; // Encrypted JSON response body.
}

// An authenticated workspace operator request for daemon-owned lifecycle work.
enum SystemAction {
  SYSTEM_ACTION_UNSPECIFIED = 0;
  SYSTEM_ACTION_RESTART_DAEMON = 1;
  SYSTEM_ACTION_RESTART_TERMINAL_HOST = 2;
}

message SystemActionRequest {
  string request_id = 1; // Random lowercase hexadecimal browser request ID.
  SystemAction action = 2;
}

message SystemActionResponse {
  string request_id = 1;
  SystemAction action = 2;
  bool ok = 3;
  string message = 4;
}

// Bidirectional streaming update from the client.
message ClientUpdate {
  reserved 5;
  oneof client_message {
    string hello = 1;           // First stream message: "name,token".
    TerminalData data = 2;      // Stream data from the terminal.
    NewShell created_shell = 3; // Acknowledge that a new shell was created.
    uint32 closed_shell = 4;    // Acknowledge that a shell was closed.
    uint32 restarted_shell = 6; // PTY state was lost and restarted in place.
    FileResponse file_response = 9; // Encrypted filesystem operation result.
    SystemActionResponse system_action_response = 10; // Lifecycle action result.
    fixed64 pong = 14;          // Response for latency measurement.
    string error = 15;
  }
}

// Bidirectional streaming update from the server.
message ServerUpdate {
  oneof server_message {
    TerminalInput input = 1;   // Remote input bytes, received from the user.
    NewShell create_shell = 2; // ID of a new shell.
    uint32 close_shell = 3;    // ID of a shell to close.
    SequenceNumbers sync = 4;  // Periodic sequence number sync.
    TerminalSize resize = 5;   // Resize a terminal window.
    WorkspaceState workspace = 6; // Workspace metadata to persist locally.
    SshProfileCollection ssh_profiles = 7; // SSH connection profiles to persist locally.
    ImageUploadChunk image_upload = 8; // Encrypted browser image stored by the daemon.
    FileRequest file_request = 9; // Encrypted filesystem operation for the daemon.
    SystemActionRequest system_action = 10; // Authenticated lifecycle action.
    fixed64 ping = 14;         // Request a pong, with the timestamp.
    string error = 15;
  }
}

// Versioned, locally persistable canvas state owned by sshxx-daemon.
message WorkspaceState {
  uint32 format_version = 1;
  repeated WorkspaceShell shells = 2;
  repeated WorkspaceNote notes = 3;
  repeated WorkspacePage pages = 4;
  repeated WorkspaceFileWindow file_windows = 5;
}

message WorkspaceShell {
  uint32 id = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 rows = 4;
  uint32 cols = 5;
  string title = 6;
  string background = 7;
  uint32 opacity = 8;
  uint32 page_id = 9;
  string theme = 10;
  uint32 width = 11;
  uint32 height = 12;
  string ssh_profile_id = 13; // SSH connection used by this terminal, empty for local shells.
}

message WorkspaceNote {
  uint32 id = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  string text = 6;
  string background = 7;
  uint32 opacity = 8;
  uint32 page_id = 9;
  repeated string paragraphs = 10;
  repeated uint32 linked_shell_ids = 11;
  repeated uint32 linked_note_ids = 12;
  repeated uint32 linked_file_window_ids = 13;
  string title = 14;
}

message WorkspacePage {
  uint32 id = 1;
  string name = 2;
}

message WorkspaceFileWindow {
  uint32 id = 1;
  uint32 shell_id = 2;
  uint32 page_id = 3;
  string path = 4;
  string title = 5;
  int32 x = 6;
  int32 y = 7;
  uint32 width = 8;
  uint32 height = 9;
  string current_path = 10;
  repeated string expanded_paths = 11;
  string selected_path = 12;
  string selected_kind = 13;
  uint32 tree_scroll_top = 14;
  string editor_path = 15;
  uint64 editor_stream = 16;
  bytes editor_data = 17; // End-to-end encrypted UTF-8 editor contents.
  bool editor_dirty = 18;
  uint32 sidebar_width = 19; // Shared file-tree pane width in canvas pixels.
  uint32 tree_revision = 20; // Change token after filesystem mutations.
  string background = 21;
}

// Authentication behavior for an OpenSSH connection profile.
enum SshAuthMethod {
  SSH_AUTH_DEFAULT = 0;
  SSH_AUTH_AGENT = 1;
  SSH_AUTH_KEY_FILE = 2;
  SSH_AUTH_PASSWORD = 3;
}

// Reusable OpenSSH connection configuration owned by sshxx-daemon.
message SshProfile {
  string id = 1;
  string name = 2;
  string host = 3;
  uint32 port = 4;
  string username = 5;
  SshAuthMethod auth_method = 6;
  string key_path = 7;
  bool accept_new_host_key = 8;
  string theme = 9; // Default terminal color theme for this connection.
  bool background_enabled = 10; // Whether background overrides the theme.
  string background = 11; // Default terminal background override.
}

// Versioned collection encrypted on disk by sshxx-daemon.
message SshProfileCollection {
  uint32 format_version = 1;
  repeated SshProfile profiles = 2;
}

// Request to stop an sshxx session gracefully.
message CloseRequest {
  string name = 1;  // Name of the session to terminate.
  string token = 2; // Session verification token.
}

// Server response to closing a session.
message CloseResponse {}

// Snapshot of a session, used to restore state for persistence across servers.
message SerializedSession {
  bytes encrypted_zeros = 1;
  map<uint32, SerializedShell> shells = 2;
  uint32 next_sid = 3;
  uint32 next_uid = 4;
  string name = 5;
  optional bytes write_password_hash = 6;
  map<uint32, SerializedNote> notes = 7;
  string daemon_version = 8;
  repeated SerializedPage pages = 9;
  repeated SshProfile ssh_profiles = 10;
  repeated SerializedFileWindow file_windows = 11;
  repeated string daemon_capabilities = 12;
}

message SerializedShell {
  uint64 seqnum = 1;
  repeated bytes data = 2;
  uint64 chunk_offset = 3;
  uint64 byte_offset = 4;
  bool closed = 5;
  int32 winsize_x = 6;
  int32 winsize_y = 7;
  uint32 winsize_rows = 8;
  uint32 winsize_cols = 9;
  string title = 10;
  string background = 11;
  uint32 opacity = 12;
  uint32 page_id = 13;
  string theme = 14;
  uint32 width = 15;
  uint32 height = 16;
}

message SerializedNote {
  int32 x = 1;
  int32 y = 2;
  string text = 3;
  string background = 4;
  uint32 opacity = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint32 page_id = 8;
  repeated string paragraphs = 9;
  repeated uint32 linked_shell_ids = 10;
  repeated uint32 linked_note_ids = 11;
  repeated uint32 linked_file_window_ids = 12;
  string title = 13;
}

message SerializedPage {
  uint32 id = 1;
  string name = 2;
}

message SerializedFileWindow {
  uint32 id = 1;
  uint32 shell_id = 2;
  uint32 page_id = 3;
  string path = 4;
  string title = 5;
  int32 x = 6;
  int32 y = 7;
  uint32 width = 8;
  uint32 height = 9;
  string current_path = 10;
  repeated string expanded_paths = 11;
  string selected_path = 12;
  string selected_kind = 13;
  uint32 tree_scroll_top = 14;
  string editor_path = 15;
  uint64 editor_stream = 16;
  bytes editor_data = 17; // End-to-end encrypted UTF-8 editor contents.
  bool editor_dirty = 18;
  uint32 sidebar_width = 19;
  uint32 tree_revision = 20;
  string background = 21;
}
