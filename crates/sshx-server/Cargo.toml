[package]
name = "sshxx-server"
version = "0.11.0"
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
edition = "2021"

[lib]
name = "sshx_server"

[features]
default = []
# Optional multi-server support; single-server builds intentionally keep Redis disabled.
redis-mesh = ["dep:deadpool", "dep:deadpool-redis", "dep:redis"]

[dependencies]
anyhow.workspace = true
async-channel = "2.5.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["http2", "ws"] }
base64 = "0.23.1"
bytes = { version = "1.12.1", features = ["serde"] }
ciborium = "0.2.2"
clap.workspace = true
dashmap = "6.2.1"
deadpool = { version = "0.13.0", optional = true }
deadpool-redis = { version = "0.23.0", optional = true }
futures-util = { version = "0.3.34", features = ["sink"] }
hmac = "0.13.0"
http = "1.5.0"
parking_lot = "0.12.5"
prost.workspace = true
rand.workspace = true
redis = { version = "1.6.0", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"], optional = true }
serde.workspace = true
sha2 = "0.11.0"
sshx-core.workspace = true
subtle = "2.6.1"
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = "0.30.0"
tonic.workspace = true
tonic-reflection.workspace = true
tower = { version = "0.5.3", features = ["steer"] }
tower-http = { version = "0.7.0", features = ["fs", "redirect", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.13.3"

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
sshx-daemon = { package = "sshxx-daemon", path = "../sshx-daemon" }
