[package]
name = "sshxx-daemon"
version = "0.11.0"
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
edition = "2021"

[lib]
name = "sshx_daemon"

[dependencies]
aes = "0.9.2"
aes-gcm.workspace = true
anstyle = "1.0.14"
anyhow.workspace = true
base64 = "0.23.1"
bytes = "1.11.1"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
cfg-if = "1.0.4"
clap.workspace = true
ctr = "0.10.1"
encoding_rs = "0.8.35"
pin-project = "1.1.13"
prost.workspace = true
openssh-sftp-client = "0.15.7"
serde.workspace = true
serde_json = "1.0.149"
sshx-core.workspace = true
sshxx-terminal-host.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
whoami = { version = "2.1.3", default-features = false }

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
nix = { version = "0.31.3", features = ["ioctl", "process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
conpty = "0.7.0"

[dev-dependencies]
sshxx-terminal-host = { workspace = true, features = ["host"] }
tempfile = "3.27.0"
