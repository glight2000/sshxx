# Optional services for multi-server integration testing. Normal development
# and single-server deployments do not need Redis and start no Compose service.
# Explicitly enable it with:
#   docker compose --profile multi-server up -d

services:
  redis:
    profiles: ["multi-server"]
    image: redis:7.2-alpine
    ports:
      - 127.0.0.1:12601:6379
